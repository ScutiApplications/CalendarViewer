<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1250" viewBox="0 0 1200 1250" role="img" aria-labelledby="title caption" style="font-family:Arial,Helvetica,sans-serif;min-width:1200px"><title id="title">03 / Memory and trust</title><desc id="caption">The page keeps short-lived context; code supplies the calendar facts the model explains.</desc><defs><marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8Z" fill="#65717a"/></marker></defs><rect width="1200" height="1250" fill="#f3f4f2"/>
<text x="40" y="49" font-size="30" fill="#222b31" font-weight="600" text-anchor="start">03 / Memory and trust</text>
<text x="40" y="82" font-size="17" fill="#4d5961" font-weight="400" text-anchor="start">The page keeps short-lived context; code supplies the calendar facts the model explains.</text>
<text x="40" y="132" font-size="21" fill="#395b78" font-weight="600" text-anchor="start">CHAT MEMORY · page-owned state</text>
<text x="608" y="132" font-size="21" fill="#306b69" font-weight="600" text-anchor="start">MODEL REASONS, CODE COMPUTES</text>
<rect x="40" y="158" width="516" height="102" rx="8" fill="#e8ebe7" stroke="#395b78" stroke-width="1.5" />
<rect x="40" y="168" width="4" height="82" fill="#395b78"/>
<text x="60" y="190" font-size="21" fill="#395b78" font-weight="600" text-anchor="start">Empty chat</text>
<text x="60" y="219" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Open page / reload → no prior chat</text>
<text x="60" y="245" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Server does not persist the conversation.</text>
<path d="M298 260 L298 310" fill="none" stroke="#65717a" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="314" y="290" font-size="16" fill="#222b31" font-weight="400" text-anchor="start">Question + successful answer</text>
<rect x="40" y="310" width="516" height="123" rx="8" fill="#e8ebe7" stroke="#395b78" stroke-width="1.5" />
<rect x="40" y="320" width="4" height="103" fill="#395b78"/>
<text x="60" y="342" font-size="21" fill="#395b78" font-weight="600" text-anchor="start">Recent exchanges</text>
<text x="60" y="371" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Each request sends summary + up to 3 exchanges.</text>
<text x="60" y="397" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Recent questions and replies travel as context.</text>
<text x="60" y="423" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Prompt says: call tools again for calendar facts.</text>
<path d="M298 433 L298 487" fill="none" stroke="#65717a" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="314" y="465" font-size="16" fill="#222b31" font-weight="400" text-anchor="start">Before answering question 4</text>
<rect x="40" y="487" width="516" height="152" rx="8" fill="#e8ebe7" stroke="#705579" stroke-width="1.5" />
<rect x="40" y="497" width="4" height="132" fill="#705579"/>
<text x="60" y="519" font-size="21" fill="#705579" font-weight="600" text-anchor="start">Compact older context</text>
<text x="60" y="548" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Same model summarizes the 3 stored exchanges</text>
<text x="60" y="574" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">plus any previous summary; recent turns clear.</text>
<text x="60" y="600" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Summary event replaces the page memory.</text>
<text x="60" y="626" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">If summarizing fails: bounded raw-text fallback.</text>
<path d="M298 639 L298 693" fill="none" stroke="#65717a" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="314" y="671" font-size="16" fill="#222b31" font-weight="400" text-anchor="start">On successful completion</text>
<rect x="40" y="693" width="516" height="102" rx="8" fill="#e8ebe7" stroke="#395b78" stroke-width="1.5" />
<rect x="40" y="703" width="4" height="82" fill="#395b78"/>
<text x="60" y="725" font-size="21" fill="#395b78" font-weight="600" text-anchor="start">Summary + new exchange</text>
<text x="60" y="754" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Accumulate another 3 exchanges, then compact.</text>
<text x="60" y="780" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Summary ≤ 1500 characters.</text>
<rect x="40" y="839" width="516" height="130" rx="8" fill="#e8ebe7" stroke="#395b78" stroke-width="1.5" />
<rect x="40" y="849" width="4" height="110" fill="#395b78"/>
<text x="60" y="871" font-size="21" fill="#395b78" font-weight="600" text-anchor="start">Clear → empty chat</text>
<text x="60" y="900" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">New chat · reload · 5 minutes without use</text>
<text x="60" y="926" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Timer restarts after an answer completes;</text>
<text x="60" y="952" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">an active answer defers the expiry.</text>
<rect x="608" y="158" width="552" height="155" rx="8" fill="#e8ebe7" stroke="#306b69" stroke-width="1.5" />
<rect x="608" y="168" width="4" height="135" fill="#306b69"/>
<text x="628" y="190" font-size="21" fill="#306b69" font-weight="600" text-anchor="start">Code · dates and working hours</text>
<text x="628" y="219" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Server-local timezone; Thursday includes today.</text>
<text x="628" y="245" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Weeks start Monday; range end is exclusive.</text>
<text x="628" y="271" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Weekday shifts can cross midnight.</text>
<text x="628" y="297" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Default hours: 09:00–17:00 if not supplied.</text>
<rect x="608" y="337" width="552" height="155" rx="8" fill="#e8ebe7" stroke="#306b69" stroke-width="1.5" />
<rect x="608" y="347" width="4" height="135" fill="#306b69"/>
<text x="628" y="369" font-size="21" fill="#306b69" font-weight="600" text-anchor="start">Code · availability and event status</text>
<text x="628" y="398" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Up to 20 slots; assistant defaults to 30 minutes.</text>
<text x="628" y="424" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Exclude past time; all-day events block slots.</text>
<text x="628" y="450" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Code computes gaps, busy minutes, countdowns.</text>
<text x="628" y="476" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Timed events: [ended] / [in progress] markers.</text>
<rect x="608" y="516" width="552" height="155" rx="8" fill="#e8ebe7" stroke="#306b69" stroke-width="1.5" />
<rect x="608" y="526" width="4" height="135" fill="#306b69"/>
<text x="628" y="548" font-size="21" fill="#306b69" font-weight="600" text-anchor="start">Code · bounds and data handling</text>
<text x="628" y="577" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Range ≤ 93 days; result arrays ≤ 30 records.</text>
<text x="628" y="603" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Model event lists: 15 lines + truncation notice.</text>
<text x="628" y="629" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Long fields truncated; tool JSON is untrusted.</text>
<text x="628" y="655" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Source actions validate dates and known events.</text>
<path d="M884 671 L884 725" fill="none" stroke="#65717a" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="900" y="703" font-size="16" fill="#222b31" font-weight="400" text-anchor="start">Bounded facts, marked as data</text>
<rect x="608" y="725" width="552" height="131" rx="8" fill="#e8ebe7" stroke="#705579" stroke-width="1.5" />
<rect x="608" y="735" width="4" height="111" fill="#705579"/>
<text x="628" y="757" font-size="21" fill="#705579" font-weight="600" text-anchor="start">Model · interpretation and language</text>
<text x="628" y="786" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Understands the question; chooses/calls tools.</text>
<text x="628" y="812" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Phrases the answer from returned facts.</text>
<text x="628" y="838" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Model-produced text cannot trigger actions.</text>
<rect x="608" y="883" width="552" height="86" rx="8" fill="#e8ebe7" stroke="#306b69" stroke-width="1.5" />
<text x="628" y="914" font-size="16" fill="#222b31" font-weight="400" text-anchor="start">Trust boundary: event fields are data, not commands.</text>
<text x="628" y="940" font-size="16" fill="#222b31" font-weight="400" text-anchor="start">The model is instructed to ignore embedded instructions.</text>
<rect x="40" y="1009" width="1120" height="155" rx="8" fill="#e8ebe7" stroke="#705579" stroke-width="1.5" />
<text x="60" y="1042" font-size="23" fill="#705579" font-weight="600" text-anchor="start">Verify against source data</text>
<text x="60" y="1076" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Small models can invent facts or misuse tools. Successful calendar tool results are shown with the answer.</text>
<text x="60" y="1104" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Replies without a successful tool result show “Not checked against your calendar” and have no sources.</text>
<text x="60" y="1132" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Chat is ephemeral in CalendarViewer; a hosted provider receives context under that provider’s own terms.</text>
<text x="40" y="1228" font-size="14" fill="#4d5961" font-weight="400" text-anchor="start">CalendarViewer · Verified against repository code · 10 November 2026</text>
</svg>