<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title caption" style="font-family:Arial,Helvetica,sans-serif;min-width:1200px"><title id="title">02 / Where the assistant runs</title><desc id="caption">Calendar data stays local with the built-in model; hosted inference crosses the internet boundary.</desc><defs><marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8Z" fill="#65717a"/></marker></defs><rect width="1200" height="1180" fill="#f3f4f2"/>
<text x="40" y="49" font-size="30" fill="#222b31" font-weight="600" text-anchor="start">02 / Where the assistant runs</text>
<text x="40" y="82" font-size="17" fill="#4d5961" font-weight="400" text-anchor="start">Calendar data stays local with the built-in model; hosted inference crosses the internet boundary.</text>
<rect x="32" y="119" width="1136" height="662" rx="8" fill="none" stroke="#65717a" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="50" y="148" font-size="17" fill="#4d5961" font-weight="600" text-anchor="start">THIS PC · default server bind 127.0.0.1</text>
<rect x="60" y="174" width="1080" height="94" rx="8" fill="#e8ebe7" stroke="#306b69" stroke-width="1.5" />
<rect x="60" y="184" width="4" height="74" fill="#306b69"/>
<text x="80" y="206" font-size="21" fill="#306b69" font-weight="600" text-anchor="start">Calendar sources</text>
<text x="80" y="235" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">ICS URLs are fetched by the server; imported .ics files are synchronized from the page.</text>
<path d="M600 268 L600 322" fill="none" stroke="#65717a" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="616" y="300" font-size="16" fill="#222b31" font-weight="400" text-anchor="start">Sources</text>
<rect x="60" y="322" width="1080" height="192" rx="8" fill="#e8ebe7" stroke="#435e50" stroke-width="1.5" />
<rect x="60" y="332" width="4" height="172" fill="#435e50"/>
<text x="80" y="354" font-size="21" fill="#435e50" font-weight="600" text-anchor="start">Background calendar server</text>
<text x="80" y="383" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Source sync + 5-minute feed cache · background alerts</text>
<text x="80" y="409" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Shared read-only calendar tools + deterministic date and availability calculations</text>
<text x="80" y="435" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Assistant routes /api/assistant/* and /api/assistant · model client + tool selector</text>
<text x="80" y="461" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Read-only MCP at /mcp: allowed Host list; rejects any Origin header</text>
<path d="M310 514 L310 568" fill="none" stroke="#65717a" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="326" y="546" font-size="16" fill="#222b31" font-weight="400" text-anchor="start">HTTP / NDJSON</text>
<path d="M885 514 L885 568" fill="none" stroke="#65717a" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="901" y="546" font-size="16" fill="#222b31" font-weight="400" text-anchor="start">Local inference</text>
<rect x="60" y="568" width="505" height="163" rx="8" fill="#e8ebe7" stroke="#395b78" stroke-width="1.5" />
<rect x="60" y="578" width="4" height="143" fill="#395b78"/>
<text x="80" y="600" font-size="21" fill="#395b78" font-weight="600" text-anchor="start">Web page</text>
<text x="80" y="629" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Calendar UI · alerts · assistant dialog</text>
<text x="80" y="655" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Page-only chat memory; plain-text answers</text>
<text x="80" y="681" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Working hours + imports/rules sync to server</text>
<rect x="605" y="568" width="535" height="163" rx="8" fill="#e8ebe7" stroke="#705579" stroke-width="1.5" />
<rect x="605" y="578" width="4" height="143" fill="#705579"/>
<text x="625" y="600" font-size="21" fill="#705579" font-weight="600" text-anchor="start">Built-in llama.cpp · MiniCPM5-2B</text>
<text x="625" y="629" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Loopback only · random port + key</text>
<text x="625" y="655" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Starts on demand; stops after 15 idle minutes</text>
<text x="625" y="681" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Engine + model files in data/llama/</text>
<text x="60" y="761" font-size="16" fill="#4d5961" font-weight="400" text-anchor="start">Built-in inference stays on this PC; initial engine/model download uses GitHub + Hugging Face.</text>
<path d="M1140 419 L1182 419" fill="none" stroke="#65717a" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M1182 419 V843 Q1182 851 1174 851 H1140" fill="none" stroke="#65717a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="60" y="817" font-size="17" fill="#4d5961" font-weight="600" text-anchor="start">INTERNET / OPTIONAL EXTERNAL SERVICES</text>
<rect x="60" y="843" width="1080" height="110" rx="8" fill="#e8ebe7" stroke="#705579" stroke-width="1.5" />
<rect x="60" y="853" width="4" height="90" fill="#705579"/>
<text x="80" y="875" font-size="21" fill="#705579" font-weight="600" text-anchor="start">Anthropic · OpenAI · Google Gemini</text>
<text x="80" y="904" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">User’s own API key · question + remembered context + bounded calendar tool results</text>
<text x="80" y="930" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Optional Laya: question → LAYA_URL (local or remote); used only with built-in provider selection</text>
<rect x="60" y="985" width="1080" height="142" rx="8" fill="#e8ebe7" stroke="#435e50" stroke-width="1.5" />
<rect x="60" y="995" width="4" height="122" fill="#435e50"/>
<text x="80" y="1017" font-size="21" fill="#435e50" font-weight="600" text-anchor="start">Request checks · scope matters</text>
<text x="80" y="1046" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Assistant routes, backup routes, startup writes and API snoozes require:</text>
<text x="80" y="1072" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">Host = localhost:PORT or 127.0.0.1:PORT; Origin absent or matching local HTTP origin;</text>
<text x="80" y="1098" font-size="17" fill="#222b31" font-weight="400" text-anchor="start">X-Calendar-Action: 1. Feed add/delete and alert-state sync do not use this guard.</text>
<text x="40" y="1158" font-size="14" fill="#4d5961" font-weight="400" text-anchor="start">CalendarViewer · Verified against repository code · 10 November 2026</text>
</svg>