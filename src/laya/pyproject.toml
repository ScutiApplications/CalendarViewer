[project]
name = "calendarviewer-laya"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["laya==0.4.31", "torch==2.10.0", "transformers==5.22.2"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
